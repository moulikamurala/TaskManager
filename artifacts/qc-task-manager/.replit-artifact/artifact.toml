kind = "web"
previewPath = "/"
title = "QC Task Manager"
description = "A scheduling-focused task manager for quality-control work. Users can create, edit, reschedule, complete, and delete tasks, view dashboard summaries, monitor queue and HTTP status, and receive browser reminders when scheduled tasks are due."
version = "1.0.0"
id = "artifacts/qc-task-manager"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20500

[services.development]
run = "pnpm --filter @workspace/qc-task-manager run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/qc-task-manager", "run", "build" ]
serve = "static"
publicDir = "artifacts/qc-task-manager/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20500"
BASE_PATH = "/"
